<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e8edf2;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;padding:20px}
.wrap{max-width:760px;margin:0 auto}
.action-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.brand-line{font-size:14px;font-weight:700;color:#0f2640}

.btn-call{background:#fff;color:#0f2640;border:2px solid #e2e8f0;padding:12px 20px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:8px;transition:all .15s}

.doc{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.15)}
.error{background:#fff;border-radius:12px;padding:40px;text-align:center}
.error h2{color:#ef4444;margin-bottom:8px}
.error p{color:#64748b;font-size:14px}
.approval-wrap{margin-top:16px;text-align:center}
.approve-form{display:inline-flex;flex-direction:column;align-items:stretch;gap:10px;width:100%;max-width:360px;text-align:left}
.approve-label{font-size:13px;font-weight:700;color:#374151}
.approve-name{padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;outline:none;transition:border-color .15s;font-family:inherit}
.approve-name:focus{border-color:#059669}
.approve-name.err{border-color:#ef4444;background:#fef2f2}
.btn-approve{background:linear-gradient(135deg,#059669,#047857);color:#fff;border:none;padding:14px 36px;border-radius:10px;font-size:15px;font-weight:800;cursor:pointer;letter-spacing:.3px}
.btn-approve:disabled{opacity:.55;cursor:default}
.approval-done{background:#d1fae5;border:1px solid #6ee7b7;border-radius:10px;padding:14px 24px;font-size:14px;font-weight:700;color:#065f46;display:inline-block}
.approval-already{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:10px;padding:14px 24px;font-size:14px;color:#475569;display:inline-block}
/* Stripe Pay Now */
.pay-wrap{margin-top:16px;text-align:center}
.pay-options{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin:0 auto}
.btn-pay-opt{display:flex;align-items:center;justify-content:space-between;width:100%;border:none;border-radius:14px;padding:16px 20px;cursor:pointer;transition:all .16s;text-align:left;box-sizing:border-box}
.btn-pay-opt:disabled{opacity:.55;cursor:default;transform:none!important}
.bpo-card{background:linear-gradient(135deg,#059669,#047857);color:#fff;box-shadow:0 4px 16px rgba(5,150,105,.3)}
.bpo-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(5,150,105,.42)}
.bpo-ach{background:linear-gradient(135deg,#2193bb,#1a78a0);color:#fff;box-shadow:0 4px 16px rgba(33,147,187,.28)}
.bpo-ach:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(33,147,187,.4)}
.bpo-left{display:flex;flex-direction:column;gap:3px}
.bpo-label{font-size:15px;font-weight:800;letter-spacing:.2px}
.bpo-sub{font-size:11px;opacity:.82;font-weight:500}
.bpo-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;margin-left:12px}
.bpo-amount{font-size:18px;font-weight:900;letter-spacing:-.3px}
.bpo-tag{font-size:10px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.6px}
.pay-note{margin-top:8px;font-size:11px;color:#94a3b8;display:flex;align-items:center;justify-content:center;gap:4px}
.pay-note svg{flex-shrink:0}
.pay-success{background:#d1fae5;border:1.5px solid #6ee7b7;border-radius:12px;padding:20px 32px;font-size:15px;font-weight:700;color:#065f46;display:inline-block;margin-top:16px}

@media print{.action-bar,.approval-wrap,.pay-wrap{display:none!important}body{background:#fff;padding:0}.doc{box-shadow:none;border-radius:0}}
@media(max-width:600px){body{padding:12px}.action-bar{flex-direction:column;align-items:stretch}.btn-print,.btn-call{justify-content:center}.btn-pay{width:100%;justify-content:center}}

// On mobile (especially Gmail/in-app WebView), window.print() is blocked.
// Use navigator.share() to open the iOS share sheet → Print → pinch to save PDF.
function handlePrint() {
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (isMobile && navigator.share) {
    navigator.share({ url: window.location.href, title: document.title }).catch(() => window.print());
  } else {
    window.print();
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _tc(s) {
  return String(s||'').replace(/\b\w/g, c => c.toUpperCase());
}
function fmtDate(d) {
  return d ? new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '—';
}
function fmtMoney(n) {
  return '$' + parseFloat(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtAddr(a) {
  if (!a) return '';
  const s = String(a).trim();
  const i = s.indexOf(', ');
  return i === -1 ? esc(s) : esc(s.slice(0, i)) + '<br>' + esc(s.slice(i + 2));
}

function _showApprovedBadge() {
  const badge = document.getElementById('estStatusBadge');
  if (badge) { badge.textContent = 'Accepted'; badge.style.background = '#16a34a'; badge.style.display = 'inline-block'; }
}

function _setApprovalWrap(html) {
  const wrap = document.querySelector('.approval-wrap');
  if (wrap) {
    wrap.innerHTML = html;
    wrap.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    return;
  }
  // Fallback: re-attach if somehow removed
  const outer = document.querySelector('.wrap');
  if (outer) {
    const div = document.createElement('div');
    div.className = 'approval-wrap';
    div.innerHTML = html;
    outer.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

async function initApproval(estId, leadId, expiryDate) {
  console.log('[EPS] initApproval — estimate_id:', estId, 'lead_id:', leadId);
  const wrap = document.createElement('div');
  wrap.className = 'approval-wrap';
  wrap.innerHTML = '<span style="color:#94a3b8;font-size:13px">Checking approval status…</span>';
  document.querySelector('.wrap').appendChild(wrap);

  try {
    const res  = await fetch(
      _SB_URL + '/functions/v1/approve-estimate?id=' + encodeURIComponent(estId),
      { headers: { 'apikey': _SB_KEY, 'Authorization': 'Bearer ' + _SB_KEY } }
    );
    if (!res.ok) throw new Error('status check failed: ' + res.status);
    const est = await res.json();
    console.log('[EPS] initApproval status check:', est);
    const isApproved = est && est.approved;
    if (isApproved) {
      const dt = est.approved_at ? new Date(est.approved_at).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '';
      const by = est.approved_by && est.approved_by !== 'customer' ? ' by ' + est.approved_by : '';
      wrap.innerHTML = '<span class="approval-already">✅ Estimate already approved' + by + (dt ? ' on ' + dt : '') + '</span>';
      _showApprovedBadge();
    } else {
      const expLine = expiryDate
        ? '<div style="font-size:12px;font-weight:700;color:#d97706;margin-bottom:2px">⏱ Estimate Expires: ' + fmtDate(expiryDate) + '</div>'
        : '<div style="font-size:12px;color:#94a3b8;margin-bottom:2px">Valid for 30 days from issue date</div>';
      wrap.innerHTML =
        '<div class="approve-form">' +
          '<label class="approve-label" for="approverName">Your Name <span style="color:#ef4444">*</span></label>' +
          '<input class="approve-name" id="approverName" type="text" placeholder="Enter your full name" maxlength="80" autocomplete="name" oninput="this.classList.remove(\'err\')">' +
          expLine +
          '<button class="btn-approve" id="btnApprove" onclick="approveEstimate(\'' + esc(estId) + '\',\'' + esc(leadId||'') + '\')">✓ Approve Estimate</button>' +
        '</div>';
    }
  } catch(e) {
    console.error('[EPS] initApproval error:', e);
    wrap.remove();
  }
}

async function approveEstimate(estId, leadId) {
  console.log('[EPS] approveEstimate called — estimate_id:', estId, 'lead_id:', leadId);
  var nameEl = document.getElementById('approverName');
  var approverName = nameEl ? nameEl.value.trim() : '';
  if (!approverName) {
    if (nameEl) { nameEl.classList.add('err'); nameEl.focus(); }
    return;
  }
  var btn = document.getElementById('btnApprove');
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  btn.textContent = 'Processing…';

  try {
    // Duplicate guard: re-fetch current status via edge function
    var chk = await fetch(
      _SB_URL + '/functions/v1/approve-estimate?id=' + encodeURIComponent(estId),
      { headers: { 'apikey': _SB_KEY, 'Authorization': 'Bearer ' + _SB_KEY } }
    );
    if (!chk.ok) throw new Error('pre-check failed: ' + chk.status);
    var est = await chk.json();
    console.log('[EPS] pre-check result:', JSON.stringify(est));

    if (est && est.approved) {
      _setApprovalWrap('<span class="approval-already">This estimate has already been approved.</span>');
      _showApprovedBadge();
      return;
    }

    var resolvedLead = leadId || null;
    var payload = JSON.stringify({ estimate_id: estId, lead_id: resolvedLead, approved_by: approverName });
    console.log('[EPS] calling edge function — payload:', payload);

    // Route through edge function which uses service role key to bypass RLS
    var res = await fetch(
      _SB_URL + '/functions/v1/approve-estimate',
      {
        method:  'POST',
        headers: {
          'apikey':        _SB_KEY,
          'Authorization': 'Bearer ' + _SB_KEY,
          'Content-Type':  'application/json'
        },
        body: payload
      }
    );
    console.log('[EPS] edge function HTTP status:', res.status);
    var result = await res.json();
    console.log('[EPS] edge function response:', JSON.stringify(result));

    if (!res.ok) {
      var msg = (result && result.message) || (result && result.error) || ('HTTP ' + res.status);
      throw new Error('edge function error: ' + msg);
    }
    if (!result.ok && !result.already_approved) {
      throw new Error('Server did not confirm approval: ' + JSON.stringify(result));
    }

    if (result.already_approved) {
      _setApprovalWrap('<span class="approval-already">This estimate has already been approved.</span>');
    } else {
      _setApprovalWrap('<span class="approval-done">✅ Estimate approved! We\'ll be in touch shortly to schedule your service.</span>');
    }
    _showApprovedBadge();

  } catch(e) {
    console.error('[EPS] approveEstimate error:', e);
    var btn2 = document.getElementById('btnApprove');
    if (btn2) { btn2.disabled = false; btn2.textContent = '✓ Approve Estimate'; }
    alert('Could not submit approval. Please call us at 678-488-2716.');
  }
}

async function initPayment(invoiceId, invoiceStatus, invoiceTotal) {
  const outer = document.querySelector('.wrap');
  if (!outer) return;

  const params = new URLSearchParams(window.location.search);
  const wrap = document.createElement('div');
  wrap.className = 'pay-wrap';

  // ?paid=1 → just came back from successful Stripe checkout
  if (params.get('paid') === '1' || invoiceStatus === 'Paid') {
    wrap.innerHTML = '<span class="pay-success">💳 Payment received — thank you! A receipt has been sent to your email.</span>';
    outer.appendChild(wrap);
    return;
  }

  // ?cancelled=1 → came back from cancelled Stripe checkout
  if (params.get('cancelled') === '1') {
    wrap.innerHTML = '<span class="pay-cancelled">Payment was cancelled. You can try again below or call 678-488-2716.</span>';
    outer.appendChild(wrap);
    // Fall through — still show the Pay Now button
  }

  // Show payment options — always two buttons: card (2.99% fee) and bank (free)
  const total     = parseFloat(invoiceTotal || 0);
  const fmtUSD    = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
  const fee       = Math.round(total * 0.0299 * 100) / 100;
  const cardTotal = Math.round((total + fee) * 100) / 100;

  const btnWrap = document.createElement('div');
  btnWrap.className = 'pay-wrap';
  btnWrap.innerHTML = `
    <div class="pay-options">
      <button class="btn-pay-opt bpo-card" id="btnPayCard" onclick="startPayment('${invoiceId}','card')">
        <div class="bpo-left">
          <div class="bpo-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:5px;margin-bottom:2px"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Pay with Card
          </div>
          <div class="bpo-sub">Visa · Mastercard · Amex · Apple Pay · Google Pay</div>
          <div class="bpo-sub" style="margin-top:2px;opacity:.75">Includes 2.99% processing fee</div>
        </div>
        <div class="bpo-right">
          <div class="bpo-amount">${fmtUSD(cardTotal)}</div>
          <div class="bpo-tag">+${fmtUSD(fee)} fee</div>
        </div>
      </button>
      <button class="btn-pay-opt bpo-ach" id="btnPayACH" onclick="startPayment('${invoiceId}','ach')">
        <div class="bpo-left">
          <div class="bpo-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:5px;margin-bottom:2px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>Pay with Bank Account
          </div>
          <div class="bpo-sub">Direct transfer from checking or savings</div>
          <div class="bpo-sub" style="margin-top:2px;opacity:.75">No processing fee</div>
        </div>
        <div class="bpo-right">
          <div class="bpo-amount">${fmtUSD(total)}</div>
          <div class="bpo-tag" style="color:#7dd3fc">FREE</div>
        </div>
      </button>
      <div class="pay-note">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Payments secured by Stripe · 256-bit SSL encryption · Escobar Property Services, LLC
      </div>
    </div>`;
  outer.appendChild(btnWrap);
}

async function startPayment(invoiceId, paymentType) {
  const btnId = paymentType === 'ach' ? 'btnPayACH' : 'btnPayCard';
  const btn = document.getElementById(btnId);
  if (!btn || btn.disabled) return;
  ['btnPayNow','btnPayCard','btnPayACH'].forEach(id => { const el=document.getElementById(id); if(el) el.disabled=true; });
  btn.innerHTML = '<span>Redirecting to checkout…</span>';

  try {
    const res = await fetch(
      _SB_URL + '/functions/v1/stripe-checkout',
      {
        method:  'POST',
        headers: { 'apikey': _SB_KEY, 'Authorization': 'Bearer ' + _SB_KEY, 'Content-Type': 'application/json' },
        body:    JSON.stringify({ invoice_id: invoiceId, payment_type: paymentType || 'card' }),
      }
    );
    const data = await res.json();
    if (data.already_paid) {
      btn.closest('.pay-wrap').innerHTML = '<span class="pay-success">💳 This invoice has already been paid. Thank you!</span>';
      return;
    }
    if (!data.url) throw new Error(data.error || 'No checkout URL returned.');
    window.location.href = data.url;
  } catch(e) {
    btn.disabled = false;
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg> Pay Now';
    alert('Could not start payment: ' + (e.message || e) + '\n\nPlease call 678-488-2716.');
  }
}


function fixMobileTables(container) {
  if (window.innerWidth > 768) return;
  setTimeout(function() {
    var w = container.clientWidth || window.innerWidth;
    if (w > 0) container.querySelectorAll('table').forEach(function(t) {
      t.style.setProperty('width', w + 'px', 'important');
      t.style.setProperty('table-layout', 'fixed', 'important');
    });
  }, 50);
}

// Decode and render
(async function() {
  const root = document.getElementById('docRoot');
  let raw;
  try {
    // Short-link path: /e/<estimate_number> or /i/<invoice_number>
    const pathMatch = window.location.pathname.match(/^\/(e|i)\/(.+)$/);
    if (pathMatch) {
      const isEst  = pathMatch[1] === 'e';
      const slug   = decodeURIComponent(pathMatch[2]);
      console.log('[EPS doc] short link — type:', isEst ? 'estimate' : 'invoice', '| slug:', slug);
      const res  = await fetch(
        _SB_URL + '/functions/v1/get-document',
        {
          method:  'POST',
          headers: { 'apikey': _SB_KEY, 'Authorization': 'Bearer ' + _SB_KEY, 'Content-Type': 'application/json' },
          body:    JSON.stringify({ type: isEst ? 'estimate' : 'invoice', number: slug, track_view: true })
        }
      );
      console.log('[EPS doc] get-document status:', res.status);
      if (!res.ok) throw new Error('Document not found');
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      data.type = isEst ? 'estimate' : 'invoice';
      if (isEst) {
        document.title = 'Estimate ' + (data.estimate_number || '') + ' — Escobar Property Services';
        root.innerHTML = renderEstimate(data);
        fixMobileTables(root);
        if (data.id) { initApproval(data.id, data.lead_id || null, data.expiration_date || data.ex || null); }
      } else {
        document.title = 'Invoice ' + (data.invoice_number || '') + ' — Escobar Property Services';
        root.innerHTML = renderInvoice(data);
        fixMobileTables(root);
        if (data.id) { initPayment(data.id, data.status, data.total); }
      }
      return;
    }

    // Legacy ?d= payload link
    const params = new URLSearchParams(window.location.search);
    raw = params.get('d');
    console.log('[EPS doc] URL param d present:', !!raw, '| length:', raw ? raw.length : 0);
    if (!raw) throw new Error('No document data in URL.');
    // URLSearchParams.get() already decodes percent-encoding once — do NOT call decodeURIComponent again
    const data = JSON.parse(raw);
    console.log('[EPS doc] parsed type:', data.type || data.t, '| estimate_id:', data.id || '(none)', '| lead_id:', data.lead_id || '(none)');
    const type = data.type || data.t;
    if (type === 'estimate' || type === 'est') {
      document.title = 'Estimate ' + (data.num || data.estimate_number || '') + ' — Escobar Property Services';
      root.innerHTML = renderEstimate(data);
      fixMobileTables(root);
      if (data.id) initApproval(data.id, data.lead_id || null, data.expiration_date || data.ex || null);
    } else if (type === 'invoice' || type === 'inv') {
      document.title = 'Invoice ' + (data.invoice_number || data.num || '') + ' — Escobar Property Services';
      root.innerHTML = renderInvoice(data);
      fixMobileTables(root);
      if (data.id) initPayment(data.id, data.status, data.total);
    } else {
      throw new Error('Unknown document type: ' + type);
    }
  } catch(e) {
    console.error('[EPS doc] render error:', e, '| raw param length:', raw ? raw.length : 0);
    // Redirect to client portal home instead of showing a dead-end error page
    root.innerHTML = '<div class="error"><h2>Document Not Found</h2><p>Redirecting you to the Client Portal&hellip;</p></div>';
    setTimeout(function() { window.location.replace('/portal'); }, 1800);
  }
})();
</script>
