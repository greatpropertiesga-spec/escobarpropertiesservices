# Redirect www.* and escobarps.com to canonical non-www production domain
server {
    listen 80;
    server_name www.escobarpropertyservices.com www.escobarps.com escobarps.com;
    return 301 https://escobarpropertyservices.com$request_uri;
}

# Canonical production server
server {
    listen 80;
    server_name localhost escobarpropertyservices.com;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # CRM app — absolute no-store so no proxy/browser/SW caches it
    location = /admin-crm-v2.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # HTML: no cache (content may change)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static assets: long cache
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Images: long cache
    location ~* \.(jpg|jpeg|png|webp|gif|svg|ico|avif)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Fonts
    location ~* \.(woff|woff2|ttf|otf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # robots.txt and sitemap: short cache
    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Default routing
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
